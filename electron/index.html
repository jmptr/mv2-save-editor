<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Strict CSP (RESEARCH §Pattern 4 / T-4-07): only same-origin (the local bundle) may load or
      execute. No inline scripts, no remote resources. The BrowserWindow loadFile + navigation deny
      land in Plan 04-05.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Same-origin stylesheet — allowed by default-src 'self'; esbuild emits dist/renderer.css beside this file. -->
    <link rel="stylesheet" href="renderer.css" />
    <title>MV2 Save Editor</title>
  </head>
  <body>
    <!-- The React root — the renderer (dist/renderer.js) mounts the Phase 5 UI here. -->
    <div id="root"></div>
    <!-- Local bundle only (esbuild emits dist/renderer.js beside this file). -->
    <script src="renderer.js"></script>
  </body>
</html>
